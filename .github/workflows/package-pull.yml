name: Run tests on pull requests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
        python -m pip install .[test]
    - name: Testing with pytest
      run: |
        pytest .

  pandas-categorical-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'
    - name: Install pandas 1.5 compatibility dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]" "numpy<2" "pandas==1.5.3"
    - name: Testing categorical and duplicate-index inputs with pandas 1.5
      run: |
        pytest \
          tests/test_known_input_regressions.py::test_tukey_categorical_group_order_matches_scipy \
          tests/test_known_input_regressions.py::test_tukey_duplicate_index_matches_scipy \
          tests/test_posthocs.py::TestPosthocs::test_posthoc_tukey_hsd_repeated_index \
          tests/test_independent_input_paths.py::test_unused_categories_are_not_treatments_and_ordered_categories_align_values
