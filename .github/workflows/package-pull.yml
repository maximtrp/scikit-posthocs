name: Run tests on pull requests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
        python -m pip install .[test]
    - name: Testing with pytest
      run: |
        pytest .

  pandas-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'
    - name: Install pandas 1.5 compatibility dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]" "numpy<2" "pandas==1.5.3"
    - name: Testing full suite with pandas 1.5
      run: |
        pytest .

  pandas-plotting-copy:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install the NumPy and pandas versions affected by issue 77
      run: python -m pip install ".[test]" "numpy==2.1.3" "pandas==2.2.3"
    - name: Test plotting with copy-on-write disabled
      env:
        PANDAS_COPY_ON_WRITE: '0'
      run: python -m pytest tests/test_plotting_input_paths.py
    - name: Test plotting with copy-on-write enabled
      env:
        PANDAS_COPY_ON_WRITE: '1'
      run: python -m pytest tests/test_plotting_input_paths.py
